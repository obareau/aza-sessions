{% extends "base.html" %}
{% block title %}Éditer preset — AZA{% endblock %}
{% block content %}

<div class="page-header">
    <div>
        <div class="page-title">✎ Éditer preset</div>
        <div class="page-subtitle">{{ note.preset_name }}{% if note.cat_name %} · {{ note.cat_name }}{% endif %}</div>
    </div>
    <a href="{{ url_for('presets.presets_list') }}" class="btn btn-secondary">← Retour</a>
</div>

<div class="card">
    <form method="POST" action="{{ url_for('presets.preset_edit', nid=note.id) }}">
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;" class="preset-edit-grid">
            <div class="form-group">
                <label>Instrument / Plugin</label>
                <select name="catalogue_id">
                    <option value="">— choisir —</option>
                    {% set types_seen = [] %}
                    {% for item in catalogue %}
                        {% if item.type not in types_seen %}
                            {% if not loop.first %}</optgroup>{% endif %}
                            <optgroup label="{{ item.type }}">
                            {% set _ = types_seen.append(item.type) %}
                        {% endif %}
                        <option value="{{ item.id }}" {% if note.catalogue_id == item.id %}selected{% endif %}>
                            {% if item.manufacturer %}{{ item.manufacturer }} — {% endif %}{{ item.name }}
                        </option>
                    {% endfor %}
                    {% if types_seen %}</optgroup>{% endif %}
                </select>
            </div>
            <div class="form-group">
                <label>Nom du preset *</label>
                <input type="text" name="preset_name" value="{{ note.preset_name }}" required>
            </div>
            <div class="form-group">
                <label>Note</label>
                <select name="rating">
                    <option value="">—</option>
                    {% for i in range(1,6) %}
                    <option value="{{ i }}" {% if note.rating == i %}selected{% endif %}>{{ '★' * i }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Date</label>
                <input type="datetime-local" name="date" value="{{ note.date[:16].replace(' ','T') }}">
            </div>
            <div class="form-group">
                <label>Rappelle (influence)</label>
                <select name="influence_id">
                    <option value="">—</option>
                    {% for inf in influences %}
                    <option value="{{ inf.id }}" {% if note.influence_id == inf.id %}selected{% endif %}>{{ inf.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Session liée</label>
                <select name="session_id">
                    <option value="">—</option>
                    {% for s in sessions %}
                    <option value="{{ s.id }}" {% if note.session_id == s.id %}selected{% endif %}>#{{ s.id }} — {{ s.date[:10] }}{% if s.title %} · {{ s.title }}{% endif %}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group" style="grid-column: 1 / -1;">
                <label>Évocation</label>
                <input type="text" name="evocation" value="{{ note.evocation or '' }}" placeholder="ambiance, texture, émotion...">
            </div>
            <div class="form-group" style="grid-column: 1 / -1;">
                <label>Idée de morceau</label>
                <input type="text" name="song_idea" value="{{ note.song_idea or '' }}" placeholder="titre ou concept de track...">
            </div>
            <div class="form-group" style="grid-column: 1 / -1;">
                <label>Tags</label>
                <input type="text" name="tags" value="{{ note.tags or '' }}" placeholder="drone, noise, rythmique...">
            </div>
            <div class="form-group" style="grid-column: 1 / -1;">
                <label>Notes libres</label>
                <textarea name="notes" rows="4">{{ note.notes or '' }}</textarea>
            </div>
        </div>
        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap;">
            <a href="{{ url_for('presets.presets_list') }}" class="btn btn-secondary">Annuler</a>
            <button type="submit" class="btn btn-primary">Sauvegarder</button>
        </div>
    </form>
</div>
<style>
@media (max-width: 900px) { .preset-edit-grid { grid-template-columns: 1fr 1fr !important; } }
@media (max-width: 600px) { .preset-edit-grid { grid-template-columns: 1fr !important; } }
</style>

{% endblock %}
