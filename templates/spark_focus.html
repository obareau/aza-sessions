{% extends "base.html" %}
{% block title %}⊙ Contrainte — Robōtariis{% endblock %}
{% block content %}

<div style="min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;">

    <!-- TYPE -->
    <div style="font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.2em;color:var(--accent);margin-bottom:32px;opacity:.8;">
        {{ focus.icon }} &nbsp; {{ focus.type }}
    </div>

    <!-- CONTRAINTE PRINCIPALE -->
    <div style="font-family:var(--mono);font-size:clamp(20px,4vw,36px);font-weight:600;line-height:1.4;color:var(--text);max-width:680px;letter-spacing:-.01em;margin-bottom:{% if focus.sub %}20px{% else %}40px{% endif %};">
        {{ focus.text|safe }}
    </div>

    <!-- SOUS-TEXTE -->
    {% if focus.sub %}
    <div style="font-family:var(--mono);font-size:13px;color:var(--text-muted);margin-bottom:40px;max-width:500px;line-height:1.7;">
        {{ focus.sub }}
    </div>
    {% endif %}

    <!-- SÉPARATEUR -->
    <div style="width:48px;height:2px;background:var(--accent);margin-bottom:40px;opacity:.4;"></div>

    <!-- ACTIONS -->
    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;">
        <a href="{{ url_for('live.live') }}" class="btn btn-primary" style="font-size:14px;padding:14px 32px;">
            ▶ Démarrer avec ça
        </a>
        <a href="{{ url_for('misc.spark_focus') }}" class="btn btn-secondary">
            ↺ Autre contrainte
        </a>
        <a href="{{ url_for('misc.spark') }}" class="btn btn-secondary">
            ← Toutes les suggestions
        </a>
    </div>

</div>

{% endblock %}
