{% extends "base.html" %}
{% block title %}Vite — AZA{% endblock %}
{% block content %}

<div class="page-header">
    <div>
        <div class="page-title">⚡ Vite</div>
        <div class="page-subtitle">Deux phrases suffisent. Le reste se complète plus tard — ou jamais.</div>
    </div>
    <a href="{{ url_for('sessions.index') }}" class="btn btn-secondary">← Retour</a>
</div>

<style>
.q-area { font-family:var(--mono);font-size:15px;line-height:1.6;background:var(--bg);
          border:1px solid var(--border);border-radius:var(--radius);padding:14px;
          color:var(--text);width:100%;box-sizing:border-box;min-height:180px;resize:vertical; }
.q-area:focus { outline:none;border-color:var(--accent); }
.q-input { font-family:var(--mono);font-size:13px;background:var(--bg);border:1px solid var(--border);
           border-radius:var(--radius);padding:9px 12px;color:var(--text);width:100%;box-sizing:border-box; }
.q-lbl { font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;
         color:var(--text-muted);font-weight:600;display:block;margin-bottom:5px; }
.q-row { display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px; }
@media (max-width:600px){ .q-row{grid-template-columns:1fr;} }
.q-bar { display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap; }
.q-mic { font-size:15px; }
.q-mic.rec { border-color:var(--danger,#c0392b);color:var(--danger,#c0392b); }
.q-hint { font-family:var(--mono);font-size:11px;color:var(--text-muted); }
#q-saved { font-family:var(--mono);font-size:11px;color:var(--text-muted);opacity:0;transition:opacity .3s; }
</style>

<form method="POST" id="q-form">
    <div class="card">
        <label class="q-lbl" for="q-text">Ce qui s'est passé</label>
        <textarea id="q-text" name="comments" class="q-area" autofocus
                  placeholder="Nappe tenue au MicroFreak, filtre ouvert lentement. Le grain se casse passé 11h sur la résonance."></textarea>

        <div class="q-bar">
            <button type="button" id="q-mic" class="btn btn-secondary q-mic" title="Dicter">🎙 Dicter</button>
            <span class="q-hint" id="q-status"></span>
            <span style="flex:1;"></span>
            <span id="q-saved">brouillon gardé</span>
            <button type="submit" class="btn btn-primary">Enregistrer</button>
        </div>

        <div class="q-row">
            <div>
                <label class="q-lbl" for="q-title">Titre <span style="text-transform:none;">— facultatif</span></label>
                <input id="q-title" type="text" name="title" class="q-input" autocomplete="off">
            </div>
            <div>
                <label class="q-lbl" for="q-machines">Machines <span style="text-transform:none;">— facultatif</span></label>
                <input id="q-machines" type="text" name="machines" class="q-input" autocomplete="off"
                       placeholder="MicroFreak, NTS-1…">
            </div>
        </div>

        <div class="q-hint" style="margin-top:14px;">
            La date est automatique. Le récap se génère ensuite depuis la session, en un bouton.
        </div>
    </div>
</form>

<script>
// ── Brouillon : sauvegardé à chaque frappe, restauré au retour ────────────────
// La saisie peut s'interrompre net. Rien ne doit être perdu pour autant, et
// aucun bouton « sauvegarder le brouillon » ne doit être à presser pour ça.
(function () {
    const KEY = 'aza_quick_draft';
    const f = { text: document.getElementById('q-text'),
                title: document.getElementById('q-title'),
                machines: document.getElementById('q-machines') };
    const saved = document.getElementById('q-saved');
    let t;

    try {
        const d = JSON.parse(localStorage.getItem(KEY) || '{}');
        if (d.text)     f.text.value = d.text;
        if (d.title)    f.title.value = d.title;
        if (d.machines) f.machines.value = d.machines;
    } catch (e) { /* brouillon illisible : on repart à blanc */ }

    function store() {
        try {
            localStorage.setItem(KEY, JSON.stringify({
                text: f.text.value, title: f.title.value, machines: f.machines.value }));
            saved.style.opacity = '1';
            setTimeout(() => { saved.style.opacity = '0'; }, 1200);
        } catch (e) { /* quota plein ou stockage refusé : tant pis */ }
    }
    Object.values(f).forEach(el =>
        el.addEventListener('input', () => { clearTimeout(t); t = setTimeout(store, 500); }));
    document.getElementById('q-form').addEventListener('submit', () => {
        try { localStorage.removeItem(KEY); } catch (e) {}
    });
})();

// ── Dictée : parler coûte moins que taper ────────────────────────────────────
(function () {
    const btn = document.getElementById('q-mic');
    const status = document.getElementById('q-status');
    const area = document.getElementById('q-text');
    let recorder = null, chunks = [];

    // getUserMedia n'existe QUE dans un contexte sécurisé : https, ou localhost.
    // Servie en http sur l'IP Tailscale, navigator.mediaDevices est undefined —
    // le bouton échouait donc en affichant « micro refusé », ce qui accusait le
    // navigateur d'un refus qui n'a jamais eu lieu. On le dit, et on donne le lien.
    if (!window.isSecureContext || !navigator.mediaDevices) {
        btn.disabled = true;
        btn.title = 'Le micro exige une connexion sécurisée';
        btn.textContent = '🎙 indisponible en http';
        const url = 'https://sessions.robotariis.com' + location.pathname;
        status.innerHTML = 'dictée possible en <a href="' + url + '">https</a>';
        return;
    }

    btn.addEventListener('click', async () => {
        if (recorder && recorder.state === 'recording') { recorder.stop(); return; }
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            chunks = [];
            recorder = new MediaRecorder(stream);
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = async () => {
                stream.getTracks().forEach(x => x.stop());
                btn.classList.remove('rec');
                btn.textContent = '🎙 Dicter';
                status.textContent = 'transcription…';
                const fd = new FormData();
                fd.append('audio', new Blob(chunks, { type: 'audio/webm' }), 'note.webm');
                try {
                    const res = await fetch('/live/transcribe', { method: 'POST', body: fd });
                    const data = await res.json();
                    if (data.text) {
                        area.value += (area.value.trim() ? '\n' : '') + data.text;
                        area.dispatchEvent(new Event('input'));   // déclenche le brouillon
                        status.textContent = '✓ transcrit';
                    } else {
                        status.textContent = '✗ ' + (data.error || 'erreur');
                    }
                } catch { status.textContent = '✗ Whisper indisponible'; }
                setTimeout(() => { status.textContent = ''; }, 3000);
            };
            recorder.start();
            btn.classList.add('rec');
            btn.textContent = '⏹ Arrêter';
            status.textContent = 'enregistrement…';
        } catch {
            status.textContent = '✗ micro refusé';
            setTimeout(() => { status.textContent = ''; }, 3000);
        }
    });
})();
</script>

{% endblock %}
