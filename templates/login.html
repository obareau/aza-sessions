<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — Robōtariis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #111210;
            --surface: #1F1E1C;
            --border: #2E2C29;
            --text: #E8E4DC;
            --text-muted: #857F78;
            --accent: #E84B1A;
            --accent-soft: #2A1710;
            --accent2: #4D7DB5;
            --accent2-soft: #111E2E;
            --success: #3D8A5F;
            --success-soft: #0F1F15;
            --mono: 'IBM Plex Mono', monospace;
            --sans: 'IBM Plex Sans', sans-serif;
            --radius: 2px;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .auth-wrap {
            width: 100%;
            max-width: 380px;
        }
        .auth-brand {
            text-align: center;
            margin-bottom: 32px;
        }
        .auth-brand-name {
            font-family: var(--mono);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            color: var(--text-muted);
        }
        .auth-brand-dot {
            display: inline-block;
            width: 8px; height: 8px;
            background: var(--accent);
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }
        .auth-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px;
        }
        .auth-title {
            font-family: var(--mono);
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-muted);
            margin-bottom: 24px;
        }
        .form-group { margin-bottom: 16px; }
        label {
            display: block;
            font-family: var(--mono);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 6px;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            font-family: var(--mono);
            font-size: 13px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 12px;
            color: var(--text);
            transition: border-color 0.15s;
        }
        input:focus { outline: none; border-color: var(--accent2); }
        .check-row {
            display: flex; align-items: center; gap: 8px;
            font-family: var(--mono); font-size: 11px; color: var(--text-muted);
        }
        .check-row input[type="checkbox"] { accent-color: var(--accent2); width: auto; }
        .btn-login {
            width: 100%;
            margin-top: 20px;
            font-family: var(--mono); font-size: 12px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.1em;
            background: var(--accent); color: white;
            border: none; border-radius: var(--radius);
            padding: 12px; cursor: pointer; transition: background 0.15s;
        }
        .btn-login:hover { background: #c53d10; }
        .flash {
            font-family: var(--mono); font-size: 11px;
            padding: 10px 12px; border-radius: var(--radius);
            margin-bottom: 16px;
        }
        .flash-error   { background: var(--accent-soft); border: 1px solid var(--accent); color: var(--accent); }
        .flash-success { background: var(--success-soft); border: 1px solid var(--success); color: var(--success); }
        .flash-info    { background: var(--accent2-soft); border: 1px solid var(--accent2); color: var(--accent2); }
    </style>
</head>
<body>
<div class="auth-wrap">
    <div class="auth-brand">
        <div class="auth-brand-name"><span class="auth-brand-dot"></span>Robōtariis Sessions</div>
    </div>

    <div class="auth-card">
        <div class="auth-title">Connexion</div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next', '')) }}">
            <div class="form-group">
                <label for="username">Utilisateur</label>
                <input type="text" id="username" name="username"
                       value="{{ request.form.get('username', '') }}"
                       autocomplete="username" autofocus required>
            </div>
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password"
                       autocomplete="current-password" required>
            </div>
            <div class="check-row">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember" style="margin-bottom:0;">Rester connecté</label>
            </div>
            <button type="submit" class="btn-login">Connexion →</button>
        </form>
    </div>
</div>
</body>
</html>
