# fly.toml — Configuration Fly.io pour Robōtariis Sessions
# Remplace "robotariis-sessions" par le nom que tu choisis au moment du `fly launch`

app = "robotariis-sessions"
primary_region = "cdg"  # Paris

[build]

[env]
  PORT = "8080"

[mounts]
  source = "sessions_data"
  destination = "/data"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    handlers = ["http"]
    port = 80
    force_https = true

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [services.concurrency]
    hard_limit = 25
    soft_limit = 20

  [[services.http_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/"
